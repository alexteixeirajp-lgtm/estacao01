<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estação 01 – Do conservadorismo à ruptura</title>
<style>
:root{--bg:#f3f8f3;--card:#ffffff;--ink:#111a14;--mut:#55655a;--pri:#14803c;--acc:#14803c;--ok:#1f9d63;--okbg:#e2f6ec;--no:#d64545;--nobg:#fde8e8;--line:#d3e3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){.btn{color:#06210f}:root:not([data-theme="light"]){--bg:#0e1611;--card:#16231a;--ink:#eef7f0;--mut:#a5bba9;--pri:#4cc274;--acc:#4cc274;--okbg:#17382b;--nobg:#3d1f24;--line:#27402f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1611;--card:#16231a;--ink:#eef7f0;--mut:#a5bba9;--pri:#4cc274;--acc:#4cc274;--okbg:#17382b;--nobg:#3d1f24;--line:#27402f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.hero{text-align:center;padding:0 0 14px}.banner{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 6px 20px rgba(20,128,60,.18)}
.badge{display:inline-block;background:var(--pri);color:#fff;font-weight:700;letter-spacing:.08em;font-size:.75rem;padding:5px 12px;border-radius:99px}
h1{font-size:2rem;margin:10px 0 4px;line-height:1.1}
h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(20,128,60,.12)}
.track{display:flex;align-items:center;margin:10px 4px 18px}
.stop{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none;transition:.3s}
.stop.done{background:var(--ok)}.stop.now{background:var(--acc);transform:scale(1.5)}
.rail{flex:1;height:4px;background:var(--line);transition:.3s}.rail.done{background:var(--ok)}
.tag{font-size:.75rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateX(3px)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
.fb{margin-top:6px;padding:12px;border-radius:12px;background:var(--bg);border-left:5px solid var(--acc);font-size:.95rem;display:none}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.btn:active{transform:scale(.98)}
.center{text-align:center}.big{font-size:3.5rem;margin:0}
.prize{border:3px dashed var(--acc);border-radius:16px;padding:14px;margin-top:14px;font-weight:700}
.conf{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
