<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estação 01 – Do Conservadorismo à Ruptura</title>
<style>
:root{--bg:#f5ead6;--card:#faf2e4;--ink:#1a1b18;--mut:#475c3f;--pri:#13411f;--onpri:#faf2e4;--acc:#315d36;--sage:#69865c;--gold:#d9b36c;--ok:#315d36;--okbg:#dfe9d0;--no:#cd1919;--nobg:#f8dcd6;--line:#e2cfae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1f12;--card:#13301c;--ink:#f5ead6;--mut:#b9c7ae;--pri:#8fb27f;--onpri:#0c1f12;--acc:#a8c79a;--sage:#69865c;--okbg:#1d4528;--ok:#8fb27f;--nobg:#4a1f1b;--line:#2b4a33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1f12;--card:#13301c;--ink:#f5ead6;--mut:#b9c7ae;--pri:#8fb27f;--onpri:#0c1f12;--acc:#a8c79a;--sage:#69865c;--okbg:#1d4528;--ok:#8fb27f;--nobg:#4a1f1b;--line:#2b4a33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(19,65,31,.14)}
.pic{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 6px 20px rgba(19,65,31,.22)}
.badge{display:inline-block;background:var(--pri);color:var(--onpri);font-weight:700;letter-spacing:.08em;font-size:.75rem;padding:5px 12px;border-radius:99px}
.track{display:flex;align-items:center;margin:14px 4px 18px}
.stop{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none;transition:.3s}
.stop.done{background:var(--sage)}.stop.now{background:var(--gold);transform:scale(1.5)}
.rail{flex:1;height:4px;background:var(--line);transition:.3s}.rail.done{background:var(--sage)}
.tag{font-size:.75rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateX(3px)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
.fb{margin-top:6px;padding:12px;border-radius:12px;background:var(--bg);border-left:5px solid var(--gold);font-size:.95rem;display:none}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.btn:active{transform:scale(.98)}
.center{text-align:center}
.prize{border:3px dashed var(--gold);border-radius:16px;padding:14px;margin-top:14px;font-weight:700;background:var(--bg)}
.win{position:relative;overflow:hidden;text-align:center;color:#faf2e4;border-radius:24px;padding:26px 20px 22px;background:linear-gradient(160deg,#13411f 0%,#315d36 100%);box-shadow:0 10px 28px rgba(19,65,31,.35)}
.win .badge{background:#d9b36c;color:#13411f}
.win h2{font-size:1.6rem;line-height:1.15;margin:8px 0 8px}
.win p{margin:0 0 6px;opacity:.95}
.gift{line-height:0;margin:12px 0 4px;animation:pop 1.2s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.12) rotate(-4deg)}}
.stars{display:flex;justify-content:center;gap:6px;font-size:1.6rem;margin:6px 0 10px}
.ticket{position:relative;background:#faf2e4;color:#1a1b18;border-radius:16px;padding:16px 14px;margin-top:16px;border:3px dashed #d9b36c}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#1f5030;transform:translateY(-50%)}
.ticket:before{left:-14px}.ticket:after{right:-14px}
.ticket .tt{font-weight:800;color:#13411f;font-size:1.1rem;letter-spacing:.04em}
.ticket .ts{font-size:.92rem;margin-top:6px;color:#475c3f}
.ticket .clock{margin-top:10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:#13411f;background:#eddcc0;border-radius:99px;display:inline-block;padding:4px 12px}
.win .btn{background:#d9b36c;color:#13411f}
.win .again{background:transparent;color:#faf2e4;border:2px solid rgba(250,242,228,.5);margin-top:10px;font-weight:700}
.conf{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
